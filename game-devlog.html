<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevLog | Первый игровой проект</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #3b82f6;
            --border-color: rgba(255, 255, 255, 0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); line-height: 1.6; padding: 2rem 1.5rem 4rem; }
        .container { max-width: 800px; margin: 0 auto; }
        .back-link { display: inline-block; color: var(--accent-blue); text-decoration: none; font-weight: 600; margin-bottom: 2rem; }
        .back-link:hover { text-decoration: underline; }
        h1 { font-size: 2.25rem; font-weight: 800; margin-bottom: 0.5rem; }
        .subtitle { color: var(--text-muted); margin-bottom: 2.5rem; }
        
        /* Стили для постов в дневнике */
        .entry { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; }
        .entry-date { font-size: 0.85rem; color: var(--accent-blue); font-weight: 600; margin-bottom: 0.5rem; }
        .entry h2 { font-size: 1.35rem; margin-bottom: 0.75rem; }
        .entry p { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 1rem; }
        .entry p:last-child { margin-bottom: 0; }
    </style>
</head>
<body>
    <div id="devlog-container">
      <p style="color: #888;">Загрузка дневников разработки...</p>
    </div>
    
    <script>
      async function loadDevlogs() {
        const container = document.getElementById('devlog-container');
        const repoOwner = 'npoxop4-svg';
        const repoName = 'npoxop4-svg.github.io';
        const folderPath = 'content/devlogs';
    
        try {
          // 1. Запрашиваем список файлов из папки content/devlogs через GitHub API
          const response = await fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/contents/${folderPath}`);
          
          if (!response.ok) {
            container.innerHTML = '<p>Пока нет опубликованных записей.</p>';
            return;
          }
    
          const files = await response.json();
          container.innerHTML = ''; // Очищаем текст загрузки
    
          // 2. Сортируем файлы так, чтобы свежие посты были сверху
          files.sort((a, b) => b.name.localeCompare(a.name));
    
          // 3. Перебираем каждый .md файл и выводим на страницу
          for (const file of files) {
            if (!file.name.endsWith('.md')) continue;
    
            const res = await fetch(file.download_url);
            const text = await res.text();
    
            // Извлекаем заголовок и дату из YAML frontmatter
            const titleMatch = text.match(/title:\s*["']?(.*?)["']?\r?\n/);
            const dateMatch = text.match(/date:\s*["']?(.*?)["']?\r?\n/);
    
            const title = titleMatch ? titleMatch[1] : 'Без названия';
            const rawDate = dateMatch ? dateMatch[1] : '';
            const formattedDate = rawDate 
              ? new Date(rawDate).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' })
              : '';
    
            // Очищаем текст поста от метаданных header (всё что между --- ---)
            const bodyContent = text.replace(/^---[\s\S]*?---/, '').trim();
    
            // Создаем карточку поста
            const card = document.createElement('article');
            card.style.cssText = `
              background: #1b2234;
              border: 1px solid #2a344a;
              border-radius: 12px;
              padding: 24px;
              margin-bottom: 20px;
            `;
    
            card.innerHTML = `
              <div style="color: #4f46e5; font-size: 0.9em; margin-bottom: 8px; font-weight: 600;">${formattedDate}</div>
              <h3 style="margin: 0 0 12px 0; color: #fff; font-size: 1.4em;">${title}</h3>
              <div style="color: #94a3b8; line-height: 1.6; white-space: pre-wrap;">${bodyContent}</div>
            `;
    
            container.appendChild(card);
          }
        } catch (error) {
          console.error('Ошибка загрузки постов:', error);
          container.innerHTML = '<p>Не удалось загрузить записи.</p>';
        }
      }
    
      // Запускаем загрузку при открытии страницы
      loadDevlogs();
    </script>
</body>
</html>
