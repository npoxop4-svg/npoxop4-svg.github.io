<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Дневник разработки: Проект №1</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b1120;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      padding: 40px 20px 80px 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    .back-link {
      display: inline-block;
      color: #3b82f6;
      text-decoration: none;
      font-size: 0.95rem;
      margin-bottom: 32px;
      transition: color 0.2s ease;
    }

    .back-link:hover {
      color: #60a5fa;
      text-decoration: underline;
    }

    .header {
      margin-bottom: 40px;
    }

    .header h1 {
      font-size: 2.2rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header p {
      color: #94a3b8;
      font-size: 1.05rem;
      line-height: 1.5;
    }

    /* Стиль карточек постов */
    .devlog-card {
      background: #172033;
      border: 1px solid #232f48;
      border-radius: 12px;
      padding: 28px;
      margin-bottom: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    }

    .devlog-date {
      color: #3b82f6;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 10px;
      text-transform: capitalize;
    }

    .devlog-title {
      font-size: 1.35rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 14px;
      line-height: 1.3;
    }

    .devlog-body {
      color: #94a3b8;
      font-size: 1rem;
      line-height: 1.65;
      white-space: pre-wrap;
    }

    .loading-state {
      color: #64748b;
      font-size: 1rem;
      padding: 20px 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Кнопка возврата -->
    <a href="index.html" class="back-link">← На главную</a>

    <!-- Шапка страницы -->
    <header class="header">
      <h1>🎮 Дневник разработки: Проект №1</h1>
      <p>История создания игры от концепта до рабочих механик.</p>
    </header>

    <!-- Контейнер, куда скрипт подгружает карточки -->
    <main id="devlog-container">
      <p class="loading-state">Загрузка дневников разработки...</p>
    </main>
  </div>

  <script>
    async function loadDevlogs() {
      const container = document.getElementById('devlog-container');
      const repoOwner = 'npoxop4-svg';
      const repoName = 'npoxop4-svg.github.io';
      const folderPath = 'content/devlogs';

      try {
        const response = await fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/contents/${folderPath}`);
        
        if (!response.ok) {
          container.innerHTML = '<p class="loading-state">Пока нет опубликованных записей.</p>';
          return;
        }

        const files = await response.json();
        container.innerHTML = '';

        // Сортировка (новые посты выше)
        files.sort((a, b) => b.name.localeCompare(a.name));

        for (const file of files) {
          if (!file.name.endsWith('.md')) continue;

          const res = await fetch(file.download_url);
          const text = await res.text();

          // Парсинг заголовка и даты
          const titleMatch = text.match(/title:\s*["']?(.*?)["']?\r?\n/);
          const dateMatch = text.match(/date:\s*["']?(.*?)["']?\r?\n/);

          const title = titleMatch ? titleMatch[1] : 'Без названия';
          const rawDate = dateMatch ? dateMatch[1] : '';
          
          let formattedDate = '';
          if (rawDate) {
            const dateObj = new Date(rawDate);
            if (!isNaN(dateObj.getTime())) {
              formattedDate = dateObj.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
            }
          }

          // Очищаем текст от метаданных header
          const bodyContent = text.replace(/^---[\s\S]*?---/, '').trim();

          // Создание карточки
          const card = document.createElement('article');
          card.className = 'devlog-card';

          card.innerHTML = `
            <div class="devlog-date">${formattedDate}</div>
            <h2 class="devlog-title">${title}</h2>
            <div class="devlog-body">${bodyContent}</div>
          `;

          container.appendChild(card);
        }
      } catch (error) {
        console.error('Ошибка загрузки постов:', error);
        container.innerHTML = '<p class="loading-state">Не удалось загрузить записи.</p>';
      }
    }

    loadDevlogs();
  </script>

</body>
</html>
